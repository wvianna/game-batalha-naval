<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 10" role="img" aria-label="Fragata">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e3e8"/>
      <stop offset="0.55" stop-color="#b0c2cd"/>
      <stop offset="1" stop-color="#7a91a2"/>
    </linearGradient>
  </defs>

  <!-- casco -->
  <rect x="0.6" y="1.4" width="18.8" height="7.2" rx="1.7" fill="url(#hull)" stroke="#3f5567" stroke-width="0.3"/>

  <!-- convés -->
  <rect x="1.3" y="2.0" width="17.4" height="6.0" rx="1.2" fill="#bcccd6"/>

  <!-- canhão dianteiro -->
  <circle cx="3.6" cy="5" r="1.4" fill="#5c7287" stroke="#3f5162"/>
  <rect x="4.2" y="4.7" width="1.6" height="0.6" rx="0.3" fill="#394d60"/>

  <!-- ponte / mastro -->
  <rect x="7.2" y="2.8" width="3.2" height="4.4" rx="0.9" fill="#596d81" stroke="#3c4e5f"/>
  <rect x="8.0" y="3.5" width="1.6" height="1.4" rx="0.4" fill="#43586b"/>
  <circle cx="8.8" cy="3.0" r="0.8" fill="#2f4150"/>

  <!-- plataforma de pouso à popa -->
  <rect x="13.0" y="3.2" width="5.2" height="3.6" rx="1.4" fill="#7c93a5"/>
  <circle cx="15.6" cy="5" r="1.5" fill="#d9e5ec" stroke="#5f7d94"/>
  <line x1="15.6" y1="3.6" x2="15.6" y2="6.4" stroke="#5f7d94" stroke-width="0.3"/>
  <line x1="14.3" y1="5" x2="16.9" y2="5" stroke="#5f7d94" stroke-width="0.3"/>
</svg>
